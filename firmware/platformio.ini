; noise-generator firmware — AI-Thinker ESP32-A1S Audio Kit (original ESP32).
;
; Toolchain pin: the official PlatformIO espressif32 platform stopped at
; Arduino core 2.x. The community fork "pioarduino" carries Arduino core 3.x
; (ESP-IDF 5.5). We pin an EXACT release zip, never `stable`, so a rebuild
; months from now produces the same firmware. 55.03.312-1 = Arduino 3.3.12.
; To upgrade: change the URL in a commit, rebuild, re-run ./scripts/test.sh.
;
; Libraries are pinned to exact versions for the same reason. Keep shipping
; dependencies Apache-2.0 / MIT / public-domain only — see docs/decisions.md
; (D5, licensing). pschatzmann's arduino-audio-tools / arduino-audio-driver /
; arduino-libhelix are GPL-3.0 and are deliberately NOT listed here.
;
; Envs:
;   probe   — Phase 0 bring-up firmware: identify the board, map keys, check
;             the SD card. Makes NO sound (the speaker amp stays disabled).
;   libcheck — compile-only link test of the shipping libraries; never flashed.
;   native  — host-side Unity tests for pure logic in lib/ (no device needed).
; Later phases add `app` (the noise generator) and `app_ota` (OTA upload).
;
; Usage (from firmware/):
;   pio run -e probe                       # build
;   pio run -e probe -t upload             # flash over USB (see docs/runbooks/flash.md)
;   pio device monitor -e probe            # watch the probe report
;   pio test -e native                     # unit tests (or ./scripts/test.sh)

[platformio]
default_envs = probe

[esp32_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32dev
framework = arduino
; ESP32-A1S module: 4 MB flash + 8 MB PSRAM (to be confirmed by esptool at
; bring-up; see docs/runbooks/bring-up.md). Bluetooth Classic + Wi-Fi builds
; are large, so use two ~1.9 MB OTA slots.
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

; The shipping library set, pinned exactly. Apache-2.0 / MIT only (D5).
; ESP32-A2DP is pinned by git tag (its registry entry lags the releases).
[libs_app]
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.12
    256dpi/MQTT@2.5.3
    bblanchon/ArduinoJson@7.4.3

[env:probe]
extends = esp32_common
build_src_filter = +<probe/>

; Compile-only smoke test of the library set + flash-size budget. Never flash.
[env:libcheck]
extends = esp32_common
build_src_filter = +<libcheck/>
lib_deps = ${libs_app.lib_deps}

[env:native]
platform = native
test_framework = unity
build_flags = -DUNIT_TEST -std=gnu++17
build_src_filter = -<*>
test_filter = test_native/*
lib_compat_mode = off
